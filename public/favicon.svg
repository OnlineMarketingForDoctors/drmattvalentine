<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0e1f1b"/>
  <!-- three waypoints on a route: the three states he flies. Same palette and
       frame as Dr Cashion's mark, which uses orchidometer beads — sibling
       sites, different subject. -->
  <path d="M7 22 L16 16 L25 10" stroke="#2f6b5c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <circle cx="7"  cy="22" r="3"   fill="#2f6b5c"/>
  <circle cx="16" cy="16" r="3"   fill="#7ea99b"/>
  <circle cx="25" cy="10" r="3.6" fill="#b0561f"/>
</svg>
